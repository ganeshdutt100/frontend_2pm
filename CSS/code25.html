<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <style>
        body {
            background-color: rgb(3, 3, 22);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
        }

        .card {
            padding: 20px;
            width: 230px;
            height: 280px;
            background-color: rgba(252, 252, 252, 0.219);
            text-align: center;
            position: relative;
            border-radius: 20px;
        }

        .emptyCircle {
            background-color: rgba(255, 140, 0, 0.792);
            top: 20%;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            position: absolute;
            filter: blur(20px);
            z-index: -1;
            animation: boxCircle 2s infinite linear alternate;
        }

        .emptyCircle1 {
            background-color: blue;
            animation: boxCircle1 2s infinite linear alternate;
        }

        .card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

        @keyframes boxCircle {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(100px);
            }
        }

        @keyframes boxCircle1 {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-100px);
            }
        }
    </style>
</head>

<body>
    <div class="cards">
        <div class="card">
            <img src="../images/Screenshot 2025-10-09 171538 - Copy.png" alt="">

            <div class="emptyCircle"></div>
            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Recusandae facere illo molestiae, dolores vitae

            </p>
            <a href="#">link..</a>
        </div>


        <div class="card">
            <img src="../images/Screenshot 2025-10-09 171538 - Copy.png" alt="">

            <div class="emptyCircle emptyCircle1"></div>
            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Recusandae facere illo molestiae, dolores vitae

            </p>
            <a href="#">link..</a>
        </div>

</html>
