<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            background-color: rgb(2, 2, 21);
            color: white;
            margin: 0;
            padding: 0;
        }

        .box {
            background: url('../images/Screenshot 2025-10-09 171647.png');
            width: 100%;
            height: 100vh;
        }

        .box1 {
            background-color: rgba(0, 0, 0, 0.45);
            width: 100%;
            height: 100%;
            position: relative;
        }

        h1 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

        }
    </style>
</head>

<body>
    <div class="box">
        <div class="box1">
            <h1>Lorem ipsum dolor sit amet.</h1>
        </div>
    </div>
</body>

</html>
