<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
        }

        .box {
            border: 5px solid white;
            width: 200px;
            height: 200px;
            background-color: red;
            margin: 100px;
            /* background: linear-gradient(45deg, red, green, blue);
            background: linear-gradient(120deg, rgba(37, 196, 175, 1) 0%, rgba(9, 9, 121, 1) 27%, rgba(255, 0, 242, 1) 96%); */
            /* background: radial-gradient(circle, red, green, blue); */
            overflow: hidden;
            transform-origin: center;

            transition: all .8s linear;





        }

        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-fit: cover;
            transition: all .8s linear;
            opacity: 0;



        }


        .box:hover {

            /* box-shadow: 1px 4px 10px 1px white; */
            /* box-shadow: inset 10px 4px 10px 1px white; */
            /* background-color: blue; */
            /* 
            transform: translateX(100px);
            transform: translateY(100px);
            transform: translate(100px, 100px); */
            transform: rotate(120deg);





        }

        .box:hover img {
            transform: scale(1.5);
            opacity: 1;
            /* transform: rotate(120deg); */


        }
    </style>
</head>

<body>
    <div class="box">
        <img src="../images/Screenshot 2025-10-09 171647 - Copy.png" alt="">
        <!-- <p>Lorem ipsum dolor sit amet.</p> -->
    </div>
</body>

</html>
